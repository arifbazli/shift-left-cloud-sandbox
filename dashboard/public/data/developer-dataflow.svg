<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="Developer-terminal dataflow: scan → GATE → deploy → verify → drift → agent → JSON → dashboard">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00d4aa"/>
    </marker>
    <filter id="card-shadow" x="-8%" y="-12%" width="116%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="210" fill="#0a0e0d"/>

  <!-- ── stage labels ──────────────────────────────────── -->
  <text x="138" y="18" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-size="10" font-weight="600" fill="#5a6e6a" letter-spacing="0.08em">① ② GATE &amp; APPLY</text>
  <text x="318" y="18" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-size="10" font-weight="600" fill="#5a6e6a" letter-spacing="0.08em">③ VERIFY</text>
  <text x="458" y="18" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-size="10" font-weight="600" fill="#5a6e6a" letter-spacing="0.08em">④ DRIFT</text>
  <text x="672" y="18" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-size="10" font-weight="600" fill="#5a6e6a" letter-spacing="0.08em">⑤ ⑥ RESPOND</text>

  <!-- ── cluster cards ─────────────────────────────────── -->
  <!-- S1: GATE & APPLY -->
  <rect x="22" y="26" width="232" height="164" rx="12" fill="#12181a" stroke="rgba(0,212,170,0.20)" stroke-width="1" filter="url(#card-shadow)"/>
  <!-- S2: VERIFY -->
  <rect x="270" y="26" width="96" height="164" rx="12" fill="#12181a" stroke="rgba(0,212,170,0.20)" stroke-width="1" filter="url(#card-shadow)"/>
  <!-- S3: DRIFT -->
  <rect x="382" y="26" width="96" height="164" rx="12" fill="#12181a" stroke="rgba(0,212,170,0.20)" stroke-width="1" filter="url(#card-shadow)"/>
  <!-- S4: RESPOND -->
  <rect x="494" y="26" width="384" height="164" rx="12" fill="#12181a" stroke="rgba(0,212,170,0.20)" stroke-width="1" filter="url(#card-shadow)"/>

  <!-- ── S1 nodes ───────────────────────────────────────── -->
  <!-- scan.sh -->
  <rect x="38" y="56" width="88" height="36" rx="8" fill="#1e2a2c" stroke="rgba(0,212,170,0.35)" stroke-width="1"/>
  <text x="82" y="79" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',monospace" font-size="12" font-weight="500" fill="#e6f7f4">scan.sh</text>

  <!-- GATE diamond -->
  <polygon points="138,62 163,86 138,110 113,86" fill="rgba(246,197,75,0.15)" stroke="#f6c54b" stroke-width="1.5"/>
  <text x="138" y="90" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-size="11" font-weight="600" fill="#f6c54b">GATE</text>

  <!-- deploy.sh -->
  <rect x="186" y="56" width="52" height="36" rx="8" fill="#1e2a2c" stroke="rgba(0,212,170,0.35)" stroke-width="1"/>
  <text x="212" y="72" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',monospace" font-size="10" font-weight="500" fill="#e6f7f4">deploy</text>
  <text x="212" y="85" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',monospace" font-size="10" font-weight="500" fill="#e6f7f4">.sh</text>

  <!-- PASS label -->
  <text x="170" y="80" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#3ecf8e" letter-spacing="0.04em">PASS</text>

  <!-- S1 arrows -->
  <line x1="126" y1="74" x2="115" y2="80" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="163" y1="86" x2="184" y2="74" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- scan → gate top arrow -->
  <line x1="126" y1="74" x2="116" y2="79" stroke="#00d4aa" stroke-width="1.5"/>
  <line x1="82" y1="74" x2="112" y2="82" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── S2: verify.sh ──────────────────────────────────── -->
  <rect x="282" y="66" width="72" height="36" rx="8" fill="#1e2a2c" stroke="rgba(0,212,170,0.20)" stroke-width="1"/>
  <text x="318" y="82" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',monospace" font-size="10" font-weight="500" fill="#e6f7f4">verify</text>
  <text x="318" y="95" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',monospace" font-size="10" font-weight="500" fill="#e6f7f4">.sh</text>

  <!-- ── S3: drift-check.sh ─────────────────────────────── -->
  <rect x="394" y="66" width="72" height="36" rx="8" fill="#1e2a2c" stroke="rgba(0,212,170,0.20)" stroke-width="1"/>
  <text x="430" y="82" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',monospace" font-size="10" font-weight="500" fill="#e6f7f4">drift-</text>
  <text x="430" y="95" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',monospace" font-size="10" font-weight="500" fill="#e6f7f4">check.sh</text>

  <!-- ── S4 nodes ───────────────────────────────────────── -->
  <!-- agent-loop.sh -->
  <rect x="510" y="56" width="82" height="36" rx="8" fill="#1e2a2c" stroke="rgba(0,212,170,0.35)" stroke-width="1"/>
  <text x="551" y="72" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',monospace" font-size="10" font-weight="500" fill="#e6f7f4">agent-</text>
  <text x="551" y="85" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',monospace" font-size="10" font-weight="500" fill="#e6f7f4">loop.sh</text>

  <!-- JSON cylinder -->
  <ellipse cx="648" cy="70" rx="30" ry="9" fill="#0a0e0d" stroke="rgba(0,212,170,0.40)" stroke-width="1"/>
  <rect x="618" y="70" width="60" height="36" fill="#0a0e0d" stroke-left="rgba(0,212,170,0.40)" stroke-right="rgba(0,212,170,0.40)"/>
  <line x1="618" y1="70" x2="618" y2="106" stroke="rgba(0,212,170,0.40)" stroke-width="1"/>
  <line x1="678" y1="70" x2="678" y2="106" stroke="rgba(0,212,170,0.40)" stroke-width="1"/>
  <ellipse cx="648" cy="106" rx="30" ry="9" fill="#0a0e0d" stroke="rgba(0,212,170,0.40)" stroke-width="1"/>
  <text x="648" y="91" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',monospace" font-size="12" font-weight="500" fill="#00d4aa">JSON</text>

  <!-- pages dev -->
  <rect x="726" y="46" width="82" height="32" rx="8" fill="#1e2a2c" stroke="rgba(0,212,170,0.20)" stroke-width="1"/>
  <text x="767" y="62" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',monospace" font-size="10" font-weight="500" fill="#8fa8a3">pages</text>
  <text x="767" y="73" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',monospace" font-size="10" font-weight="500" fill="#8fa8a3">dev</text>

  <!-- pages deploy -->
  <rect x="726" y="108" width="82" height="32" rx="8" fill="#1e2a2c" stroke="rgba(0,212,170,0.20)" stroke-width="1"/>
  <text x="767" y="124" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',monospace" font-size="10" font-weight="500" fill="#8fa8a3">pages</text>
  <text x="767" y="135" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',monospace" font-size="10" font-weight="500" fill="#8fa8a3">deploy</text>

  <!-- ── inter-cluster arrows ───────────────────────────── -->
  <!-- deploy → verify -->
  <line x1="238" y1="74" x2="280" y2="74" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="none"/>

  <!-- verify → drift -->
  <line x1="354" y1="84" x2="392" y2="84" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- drift label -->
  <text x="373" y="79" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#5a6e6a">drift</text>

  <!-- drift → agent -->
  <line x1="466" y1="84" x2="508" y2="74" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- agent → JSON -->
  <line x1="592" y1="74" x2="616" y2="80" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- JSON → pages dev -->
  <line x1="678" y1="76" x2="724" y2="62" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- JSON → pages deploy -->
  <line x1="678" y1="100" x2="724" y2="118" stroke="#00d4aa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── legend ─────────────────────────────────────────── -->
  <rect x="22" y="200" width="0" height="0"/>
  <text x="22" y="204" font-family="'Inter',system-ui,sans-serif" font-size="9" fill="#5a6e6a">
    <tspan>■ teal border = action  </tspan>
    <tspan>◇ amber = security gate  </tspan>
    <tspan>⬭ teal = data store  </tspan>
    <tspan>■ dim = surface/output</tspan>
  </text>
</svg>
