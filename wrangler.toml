# =============================================================================
# wrangler.toml
# =============================================================================
# This file is for Cloudflare Pages. The dashboard is a static site served
# from dashboard/public/. NO KV, NO D1, NO Workers scripts attached.
#
# To preview locally:
#   wrangler pages dev dashboard/public
#
# Architecture note:
#   The frontend fetches whatever's under dashboard/public/data/*.json from
#   this same Pages project — 14 files as of 2026-08-13 (10 AWS + 4 Azure);
#   see CONTEXT.md's data-plane table for the current, authoritative list
#   rather than duplicating it here where it'll go stale again.
#   All backend services (floci-core, floci-az, podman, terraform.tfstate)
#   live on the local machine. Nothing except these JSON files ever leaves it.
# =============================================================================
name = "shift-left-cloud-sandbox"
pages_build_output_dir = "dashboard/public"
compatibility_date = "2024-09-23"

# No [vars], no [[kv_namespaces]], no [[d1_databases]], no [[r2_buckets]].
# Keeping the project honest about "static assets only".
