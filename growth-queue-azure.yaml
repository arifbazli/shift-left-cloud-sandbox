# growth-queue-azure.yaml
# =============================================================================
# Ordered resource addresses scripts/grow-stack-azure.sh applies one at a
# time, oldest-first, on scheduled CI runs only. Azure sibling of
# growth-queue.yaml (AWS) — separate file, separate script, separate state
# (terraform/azure/), mirroring that file's structure exactly. Intended CI
# cache key (not wired yet — pipeline.yml integration is out of scope
# tonight): growth-state-azure-${{ github.run_id }}, same prefix-restore
# pattern as the AWS queue's growth-state-${{ github.run_id }}.
#
# Rules:
#   - Every address already exists in terraform/modules/azure-*/**/*.tf.
#     This file only sequences EXISTING resources — it never defines new
#     ones.
#   - Order encodes dependency order: an address's terraform-graph deps
#     must already appear earlier in this list. Once any run has applied
#     an address, DO NOT reorder or remove it — later state depends on it.
#   - The security fixture (AVD-AZU-0013, network_acls on
#     azurerm_key_vault.main) is NOT excluded from this queue the way
#     AWS's fixture is excluded from growth-queue.yaml — it can't be: the
#     fixture here is an omission inside an EXISTING resource
#     (module.azure-security.azurerm_key_vault.main), not a separate
#     resource. Handled the same way it always has been: grow-stack-
#     azure.sh's precondition 1 (tfsec gate PASS) already refuses to grow
#     at all while the fixture is on. scripts/toggle-fixture-azure.sh is
#     still the ONLY sanctioned way to change the fixture's state.
#
# HONEST NOTE ON THIS QUEUE'S SHAPE (2026-08-13): items 12-22 (roughly half)
# are confirmed-broken or inconclusive, not just "might not apply" the way
# AWS's EKS/MSK/OpenSearch tail is — several hang indefinitely with no
# natural timeout, not just slowly. Past item 11 (azurerm_storage_account.
# main), forward progress is expected to be minimal for a long time. See
# grow-stack-azure.sh's header for how apply timeouts are handled as a
# result, and each item below for the specific finding.
# =============================================================================
queue:
  # -- azure-network (all 10 confirmed working, 2026-08-13 real apply) -------
  - module.azure-network.azurerm_resource_group.main
  - module.azure-network.azurerm_virtual_network.main
  - module.azure-network.azurerm_subnet.private
  - module.azure-network.azurerm_network_security_group.app
  - module.azure-network.azurerm_subnet_network_security_group_association.private
  - module.azure-network.azurerm_network_security_rule.ssh_admin
  - module.azure-network.azurerm_network_security_rule.app_internal
  - module.azure-network.azurerm_network_security_rule.egress_https
  - module.azure-network.azurerm_network_security_rule.egress_dns_tcp
  - module.azure-network.azurerm_network_security_rule.egress_dns_udp

  # -- azure-storage ------------------------------------------------------------
  - module.azure-storage.azurerm_storage_account.main
  # CONFIRMED UNFIXABLE AT THE TERRAFORM LEVEL (2026-08-14 follow-up
  # investigation, see CONTEXT.md's Research log for the full writeup):
  # both resources below hang indefinitely on apply — ZERO corresponding
  # request ever appeared in floci-az's own logs, confirming the hang is
  # client-side, before any request is even sent. Root cause, confirmed
  # via a direct ARM API probe against the real container: floci-az
  # returns real-Azure-shaped data-plane hostnames with NO PORT and
  # scheme http, e.g. "blob":"http://<account>.blob.core.windows.net/" —
  # so even a DNS-level fix (custom resolver, /etc/hosts) would only get
  # a client to port 80, and floci-az listens on :4577 only. Checked
  # floci-az's own docs directly: no DNS/hosts-file component or env var
  # (FLOCI_AZ_HOSTNAME/FLOCI_AZ_BASE_URL) that changes this — those only
  # affect TLS cert SANs, not ARM response bodies. A real fix needs a
  # host-level DNS resolver AND a port 80/443->4577 redirect (iptables
  # NAT or a reverse proxy), which is a materially bigger, more
  # privileged host change than this queue's tags/405 fix and was not
  # attempted. Kept per the visible-stall-over-silent-skip design —
  # retried forever (bounded by APPLY_TIMEOUT_SECONDS per attempt, see
  # grow-stack-azure.sh).
  - module.azure-storage.azurerm_storage_container.artifacts
  - module.azure-storage.azurerm_storage_table.main

  # -- azure-security -------------------------------------------------------------
  - module.azure-security.azurerm_key_vault.main
  # CONFIRMED UNFIXABLE AT THE TERRAFORM LEVEL (2026-08-14), same root
  # cause as the storage entries above: floci-az's Key Vault ARM response
  # returns a real-Azure-shaped vaultUri with no port
  # (https://<vault>.vault.azure.net/), which the azurerm provider uses
  # directly for secret data-plane calls. Same port-mismatch problem (443
  # vs floci-az's :4577), same conclusion: needs a host-level DNS + port
  # redirect, not a Terraform or floci-az config change. Kept, retried
  # forever (bounded per attempt).
  - module.azure-security.azurerm_key_vault_secret.app_config

  # -- azure-compute --------------------------------------------------------------
  - module.azure-compute.azurerm_network_interface.app
  - module.azure-compute.tls_private_key.app
  - module.azure-compute.azurerm_linux_virtual_machine.app
  - module.azure-compute.azurerm_storage_account.functions
  # CONFIRMED FAILURE, ROOT CAUSE ISOLATED (2026-08-14 follow-up — see
  # CONTEXT.md's Research log; supersedes the 2026-08-13 "inconclusive"
  # classification, which described a silent 10+ minute hang under the
  # image pulled that night). Reproduced fresh via a real traced
  # `terraform apply -target` AND a direct curl PUT with the provider's
  # exact api-version (2023-12-01): the create PUT to `Microsoft.Web/
  # serverFarms/{name}` returns an IMMEDIATE `404 ResourceNotFound`
  # against the resource's OWN path — not a hang. Confirmed this is
  # specific to `serverFarms`, not a generic "unregistered namespace"
  # limitation: a PUT to `Microsoft.Web/sites/{name}` in the same
  # resource group, same provider namespace, same generic ArmHandler
  # fallback, returns `200 OK` and creates successfully. floci-az's
  # fallback handler evidently doesn't recognize `serverFarms` as a
  # creatable resource type the way it does `sites` — a gap in floci-az
  # itself, not a Terraform config issue. Because the Function App below
  # depends on this, it never even starts applying while this fails.
  - module.azure-compute.azurerm_service_plan.functions
  - module.azure-compute.azurerm_linux_function_app.main
  # CONFIRMED FAILURE, CONFIRMED PERMANENT HOST LIMITATION (2026-08-13
  # isolated test, root-caused further 2026-08-14 -- see CONTEXT.md's
  # Research log): the netavark/iptables fix (podman-compose.yml) works
  # correctly here -- the k3s container is created and STARTS. k3s itself
  # then crashes fatally within ~1 second: "Error: failed to find cpuset
  # cgroup (v2)". Confirmed directly (2026-08-14): the KERNEL has cpuset
  # available (/sys/fs/cgroup/cgroup.controllers lists it at the root),
  # but systemd does NOT delegate it down to the user slice
  # (/sys/fs/cgroup/user.slice/user-<uid>.slice/cgroup.controllers and
  # `podman info`'s CgroupControllers both list only cpu/memory/pids --
  # no cpuset). This is a systemd delegation gap, not a Podman config
  # toggle: the only fix is a root-owned systemd drop-in
  # (/etc/systemd/system/user@.service.d/*.conf with Delegate=cpuset,
  # then daemon-reload + re-login), a privileged host-wide change, not
  # attempted per the same "report, don't force" framing as AWS's EKS
  # uncertainty. floci-az's own provisioningState never leaves "Creating"
  # (it doesn't detect the backing container died), so this stalls
  # forever from the ARM API's perspective too, not just slowly.
  - module.azure-compute.azurerm_kubernetes_cluster.main
