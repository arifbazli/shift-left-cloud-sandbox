# floci-core (moto-server AWS mock) for floci-stack
# Usage:
#   podman-compose up -d    # start
#   podman-compose down     # stop
#   podman-compose ps       # status
#
# This file exists so the README Quick Start works out of the box.
# floci-core emulates AWS services on localhost:4566 — no real AWS calls.
# Image: docker.io/motoserver/moto (Apache-2.0, no auth required)
#
# network_mode: host — required on WSL2 where the netavark backend cannot
# apply nftables rulesets (missing kernel capability). host mode binds
# the container directly to the host network stack, no bridge needed.

services:
  floci-core:
    container_name: floci-core
    image: docker.io/motoserver/moto:latest
    network_mode: host
    command: ["-H", "0.0.0.0", "-p", "4566"]
    environment:
      MOTO_ACCOUNT_ID: "000000000000"
    volumes:
      - floci-data:/tmp/moto
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_period: 20s

volumes:
  floci-data: