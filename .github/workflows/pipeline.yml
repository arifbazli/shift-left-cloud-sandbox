# =============================================================================
# .github/workflows/pipeline.yml
# =============================================================================
# Shift-left gate pipeline for floci-stack.
#
# Job graph:
#   scan ──► deploy-local ──► publish-dashboard
#    └──► pr-comment  (PR events only)
#
# SEC_INTENT: scan is the single chokepoint. deploy-local and publish-dashboard
# only run after scan exits 0. A HIGH or CRITICAL tfsec finding blocks all
# downstream jobs and posts a failing status on the PR/commit.
#
# Runner environment notes (self-hosted, Debian WSL):
#   PATH:            ~/.local/bin must be prepended — tfsec is installed there,
#                    not in /usr/local/bin. The systemd user service PATH does
#                    not include ~/.local/bin by default.
#   XDG_RUNTIME_DIR: must be set explicitly for rootless Podman. The runner
#                    service inherits it from systemd --user, but GitHub
#                    Actions step environments do not always propagate it.
#   DOCKER_HOST:     set to the podman socket as a fallback for tools that
#                    prefer DOCKER_HOST over XDG_RUNTIME_DIR auto-detection.
# =============================================================================

name: Shift-Left Security Pipeline

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

# Cancel stale runs on the same ref to avoid queue buildup.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions; jobs escalate only what they need.
permissions:
  contents: read

# ---------------------------------------------------------------------------
# Shared env block for all self-hosted runner jobs.
# Injected at workflow level; jobs may override individual keys.
# ---------------------------------------------------------------------------
env:
  # Prepend ~/.local/bin so tfsec (1.28.5) and other user-installed tools
  # are found before the system PATH entries.
  PATH_PREFIX: /home/arif_debian/.local/bin

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — scan
  # Runs tfsec against terraform/ and writes dashboard data.
  # SEC_INTENT: self-hosted runner so tfsec 1.28.5 is pre-installed at a
  # pinned path — GitHub-hosted runners can't guarantee the exact binary.
  # ---------------------------------------------------------------------------
  scan:
    name: "tfsec gate"
    runs-on: floci-self-hosted

    env:
      PATH: /home/arif_debian/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hard-fail if the runner has a different tfsec version.
      # SEC_INTENT: version drift silently changes rule coverage;
      # the fixture depends on AVD-AWS-0057 being present in 1.28.5.
      - name: Verify tfsec version
        run: |
          VERSION=$(tfsec --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          echo "Detected tfsec version: $VERSION"
          if [[ "$VERSION" != "1.28.5" ]]; then
            echo "::error::tfsec version mismatch: got '$VERSION', expected 1.28.5"
            echo "::error::tfsec must be installed at /home/arif_debian/.local/bin/tfsec"
            exit 1
          fi
          echo "tfsec $VERSION ✓"

      - name: Run security gate (scripts/scan.sh)
        id: gate
        run: bash scripts/scan.sh

      # Always upload the result so downstream jobs and pr-comment can read it,
      # even if the gate fails (upload-artifact runs on failure too).
      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-result
          path: dashboard/public/data/tfsec-last.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # JOB 2 — deploy-local
  # Runs terraform apply against LocalStack (rootless Podman) on the
  # self-hosted runner. Only fires on push to main, never on PRs.
  # SEC_INTENT: PRs must never mutate local infra state; the gate on
  #   github.event_name == 'push' enforces that boundary.
  # ---------------------------------------------------------------------------
  deploy-local:
    name: "terraform apply (LocalStack)"
    runs-on: floci-self-hosted
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      # Prepend ~/.local/bin for user-installed tools (terraform, tfsec, etc.)
      PATH: /home/arif_debian/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Rootless Podman socket — must be explicit; not inherited from systemd service env.
      XDG_RUNTIME_DIR: /run/user/1000
      DOCKER_HOST: unix:///run/user/1000/podman/podman.sock
      # LocalStack dummy credentials — not real AWS.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      FLOCI_ENDPOINT: http://localhost:4566

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Start floci-core
        run: |
          podman-compose -f podman-compose.yml up -d
          echo "Waiting for floci-core at $FLOCI_ENDPOINT ..."
          for i in $(seq 1 30); do
            if curl -sf -m 3 -o /dev/null "$FLOCI_ENDPOINT/health" 2>/dev/null \
               || curl -sf -m 3 -o /dev/null "$FLOCI_ENDPOINT/" 2>/dev/null; then
              echo "floci-core is up."
              break
            fi
            sleep 2
          done

      # Verify rootless Podman is accessible before attempting compose.
      - name: Check Podman socket
        run: |
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"
          echo "DOCKER_HOST=$DOCKER_HOST"
          podman info --format '{{.Host.RemoteSocket.Path}}' 2>/dev/null \
            && echo "Podman socket: OK" \
            || { echo "::warning::podman info failed — socket may not be ready"; }
          podman ps --format '{{.Names}}' 2>/dev/null \
            && echo "podman ps: OK" \
            || { echo "::error::podman ps failed — rootless Podman not accessible"; exit 1; }

      - name: Start floci-core
        run: |
          podman-compose -f podman-compose.yml up -d
          echo "Waiting for floci-core at $FLOCI_ENDPOINT ..."
          for i in $(seq 1 30); do
            if curl -sf -m 3 -o /dev/null "$FLOCI_ENDPOINT/health" 2>/dev/null \
               || curl -sf -m 3 -o /dev/null "$FLOCI_ENDPOINT/_localstack/health" 2>/dev/null \
               || curl -sf -m 3 -o /dev/null "$FLOCI_ENDPOINT/" 2>/dev/null; then
              echo "floci-core is up (attempt $i)."
              break
            fi
            echo "  attempt $i/30 — waiting 2s ..."
            sleep 2
          done

      - name: Download scan result
        uses: actions/download-artifact@v4
        with:
          name: scan-result
          path: dashboard/public/data/

      - name: Apply (scripts/deploy.sh)
        run: bash scripts/deploy.sh

  # ---------------------------------------------------------------------------
  # JOB 3 — publish-dashboard
  # Pushes dashboard/public/ to Cloudflare Pages.
  # Uses a GitHub-hosted runner — the Cloudflare action needs internet egress
  # and has no dependency on the local LocalStack stack.
  # SEC_INTENT: CLOUDFLARE_API_TOKEN scoped to Pages only (least-privilege).
  # ---------------------------------------------------------------------------
  publish-dashboard:
    name: "publish to Cloudflare Pages"
    runs-on: ubuntu-latest
    needs: deploy-local
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      deployments: write   # required by pages-action to create a deployment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download scan result
        uses: actions/download-artifact@v4
        with:
          name: scan-result
          path: dashboard/public/data/

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: shift-left-cloud-sandbox
          directory: dashboard/public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # JOB 4 — pr-comment
  # Posts a markdown gate summary as a PR comment.
  # Only runs on pull_request events.
  # ---------------------------------------------------------------------------
  pr-comment:
    name: "post gate summary"
    runs-on: ubuntu-latest
    needs: scan
    if: always() && github.event_name == 'pull_request'

    permissions:
      pull-requests: write

    steps:
      - name: Download scan result
        uses: actions/download-artifact@v4
        with:
          name: scan-result
          path: /tmp/scan/
        continue-on-error: true

      - name: Build comment body
        id: body
        run: |
          RESULT_FILE="/tmp/scan/tfsec-last.json"
          if [[ ! -f "$RESULT_FILE" ]]; then
            echo "body=⚠️ Scan artifact not found — gate may have failed before writing output." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "$RESULT_FILE" << 'PYEOF'
          import sys, json, os

          with open(sys.argv[1]) as f:
              d = json.load(f)

          gate   = d.get("gate", "UNKNOWN")
          ts     = d.get("timestamp", "—")
          ver    = d.get("tfsec_version", "—")
          counts = d.get("counts", {})
          crit   = counts.get("critical", 0)
          high   = counts.get("high", 0)
          med    = counts.get("medium", 0)
          low    = counts.get("low", 0)

          icon = "✅" if gate == "PASS" else "❌"
          lines = [
              f"## {icon} tfsec Gate: **{gate}**",
              "",
              "| Severity | Count |",
              "|----------|-------|",
              f"| 🔴 CRITICAL | {crit} |",
              f"| 🟠 HIGH     | {high} |",
              f"| 🟡 MEDIUM   | {med}  |",
              f"| 🔵 LOW      | {low}  |",
              "",
              f"tfsec `{ver}` · `{ts}`",
          ]

          findings = d.get("findings", [])
          blocking = [r for r in findings if r.get("severity","").upper() in ("HIGH","CRITICAL")]
          if blocking:
              lines.append("")
              lines.append("### Blocking findings")
              lines.append("| Severity | Rule | Resource | Description |")
              lines.append("|----------|------|----------|-------------|")
              for r in blocking[:10]:
                  lines.append(f"| {r['severity']} | `{r.get('rule_id','')}` | `{r.get('resource','')}` | {r.get('description','')[:80]} |")

          body = "\n".join(lines)
          delim = "EOF_BODY"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"body<<{delim}\n{body}\n{delim}\n")
          PYEOF

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.body.outputs.body }}
          edit-mode: replace
