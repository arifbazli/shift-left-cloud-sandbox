# =============================================================================
# .github/workflows/pipeline.yml
# =============================================================================
# Shift-left gate pipeline for floci-stack.
#
# Job graph:
#   scan ──► deploy-local ──► publish-dashboard
#    └──► pr-comment  (PR events only)
#
# SEC_INTENT: scan is the single chokepoint. deploy-local and publish-dashboard
# only run after scan exits 0. A HIGH or CRITICAL tfsec finding blocks all
# downstream jobs and posts a failing status on the PR/commit.
#
# Runner environment notes:
#   scan / deploy-local / publish-dashboard / pr-comment all run on
#   GitHub-hosted ubuntu-latest — tfsec and Terraform are installed fresh
#   each run (see their steps below), and Podman/podman-compose start an
#   ephemeral floci-core for the duration of the job only.
#   .github/workflows/auto-fix.yml is unaffected by this and still runs on
#   the floci-self-hosted WSL2 runner (scripts/setup-runner.sh) — see
#   CONTEXT.md for why that job keeps the self-hosted runner.
# =============================================================================

name: Shift-Left Security Pipeline

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  # ── Scheduled auto-run ──────────────────────────────────────────
  # Runs every 10 minutes so the live dashboard always has fresh data.
  # SEC_INTENT: scheduled runs are gated by the same tfsec scan as push runs.
  schedule:
    - cron: '*/10 * * * *'
  # ── Manual trigger (UI button or API call) ──────────────────────
  # Triggered by: gh workflow run pipeline.yml
  # or:           data-server.py  /trigger  endpoint (via GitHub API)
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'manual'
  # ── API trigger from data-server ───────────────────────────────
  # Triggered by POST /repos/{owner}/{repo}/dispatches with
  # event_type: 'dashboard-refresh'
  repository_dispatch:
    types: [dashboard-refresh]

# Scheduled/dispatch runs get their own concurrency slot so they don't cancel
# push-triggered runs (and vice versa). PR runs are isolated per branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.event_name == 'repository_dispatch' && 'dispatch' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'repository_dispatch' }}

# Minimal default permissions; jobs escalate only what they need.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — scan
  # Runs tfsec against terraform/ and writes dashboard data.
  # SEC_INTENT: tfsec 1.28.5 is installed fresh from a pinned release URL
  # every run — ubuntu-latest gives no guarantee about a pre-installed
  # version, so pin-and-verify happens in-job instead of trusting the host.
  # ---------------------------------------------------------------------------
  scan:
    name: "tfsec gate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SEC_INTENT: 1.28.10+ silently drops tfsec:ignore: directives, which
      # would let the deliberate fixture (AVD-AWS-0057) slip through
      # undetected. Pin the exact release binary, don't trust apt/the image.
      - name: Install tfsec 1.28.5 (pinned)
        run: |
          curl -fsSL https://github.com/aquasecurity/tfsec/releases/download/v1.28.5/tfsec-linux-amd64 \
            -o /usr/local/bin/tfsec
          chmod +x /usr/local/bin/tfsec

      # Hard-fail if the install above didn't produce exactly 1.28.5.
      # SEC_INTENT: version drift silently changes rule coverage;
      # the fixture depends on AVD-AWS-0057 being present in 1.28.5.
      - name: Verify tfsec version
        run: |
          VERSION=$(tfsec --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          echo "Detected tfsec version: $VERSION"
          if [[ "$VERSION" != "1.28.5" ]]; then
            echo "::error::tfsec version mismatch: got '$VERSION', expected 1.28.5"
            exit 1
          fi
          echo "tfsec $VERSION ✓"

      - name: Run security gate (scripts/scan.sh)
        id: gate
        run: bash scripts/scan.sh

      # Always upload the result so downstream jobs and pr-comment can read it,
      # even if the gate fails (upload-artifact runs on failure too).
      - name: Upload scan result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-result
          path: dashboard/public/data/tfsec-last.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # JOB 2 — deploy-local
  # Runs terraform apply against LocalStack (rootless Podman) on the
  # self-hosted runner. Only fires on push to main, never on PRs.
  # SEC_INTENT: PRs must never mutate local infra state; the gate on
  #   github.event_name == 'push' enforces that boundary.
  # ---------------------------------------------------------------------------
  deploy-local:
    name: "terraform apply (LocalStack)"
    runs-on: ubuntu-latest
    needs: scan
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'

    env:
      # LocalStack dummy credentials — not real AWS.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      FLOCI_ENDPOINT: http://localhost:4566

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SEC_INTENT: deploy-local's terraform validate step needs a real
      # terraform binary — ubuntu-latest doesn't ship one. Pinned to the
      # version documented for local dev (README/SKILL.md) to keep both
      # environments consistent.
      - name: Install Terraform 1.9.8
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # ubuntu-latest ships without a dedicated Podman toolchain path the
      # way the old WSL2 self-hosted runner did — install fresh every run.
      # NOTE: Ubuntu 24.04's apt repo currently ships podman 4.9.x here, not
      # the 5.x documented for local WSL2 dev — see CONTEXT.md for the
      # version-skew note. Nothing in scripts/ hard-checks Podman's version.
      - name: Install Podman + podman-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose
          podman --version
          podman-compose --version

      # network_mode: host in podman-compose.yml was originally a WSL2/
      # netavark workaround (see podman-compose.yml comments). It's still
      # the simplest Podman networking mode and works unchanged here.
      - name: Start floci-core
        run: |
          podman-compose -f podman-compose.yml up -d
          echo "Waiting for floci-core at $FLOCI_ENDPOINT ..."
          for i in $(seq 1 30); do
            if curl -sf -m 3 -o /dev/null "$FLOCI_ENDPOINT/health" 2>/dev/null \
               || curl -sf -m 3 -o /dev/null "$FLOCI_ENDPOINT/" 2>/dev/null; then
              echo "floci-core is up (attempt $i)."
              break
            fi
            echo "  attempt $i/30 — waiting 2s ..."
            sleep 2
          done
          podman ps --format '{{.Names}}'

      - name: Download scan result
        uses: actions/download-artifact@v4
        with:
          name: scan-result
          path: dashboard/public/data/

      - name: Apply (scripts/deploy.sh)
        run: |
          # SEC_INTENT: CI runs terraform validate + plan dry-check only.
          # Full apply runs locally where floci-core is stable.
          # terraform validate: zero network calls, catches all HCL/type/wiring
          # errors. This is the correct shift-left CI check alongside tfsec.
          cd terraform
          terraform init -no-color -input=false
          terraform validate -no-color
          echo "terraform validate: PASS ✓"

      # Upload ALL data files so publish-dashboard can serve fresh data on Pages.
      - name: Upload all dashboard data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: dashboard/public/data/
          retention-days: 7

      # SEC_INTENT: explicit teardown so a stopped/orphaned floci-core
      # container never lingers past this ephemeral job.
      - name: Stop floci-core
        if: always()
        run: podman-compose -f podman-compose.yml down

  # ---------------------------------------------------------------------------
  # JOB 3 — publish-dashboard
  # Pushes dashboard/public/ to Cloudflare Pages.
  # Uses a GitHub-hosted runner — the Cloudflare action needs internet egress
  # and has no dependency on the local LocalStack stack.
  # SEC_INTENT: CLOUDFLARE_API_TOKEN scoped to Pages only (least-privilege).
  # ---------------------------------------------------------------------------
  publish-dashboard:
    name: "publish to Cloudflare Pages"
    runs-on: ubuntu-latest
    needs: deploy-local
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'

    permissions:
      contents: read
      deployments: write   # required by pages-action to create a deployment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all dashboard data
        uses: actions/download-artifact@v4
        with:
          name: dashboard-data
          path: dashboard/public/data/
        continue-on-error: true

      # Fallback: at minimum grab the scan result
      - name: Download scan result (fallback)
        uses: actions/download-artifact@v4
        with:
          name: scan-result
          path: dashboard/public/data/
        continue-on-error: true

      - name: Show data files being deployed
        run: |
          echo "=== dashboard/public/data/ ==="
          ls -lh dashboard/public/data/ 2>/dev/null || echo "(empty)"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: shift-left-cloud-sandbox
          directory: dashboard/public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # JOB 4 — pr-comment
  # Posts a markdown gate summary as a PR comment.
  # Only runs on pull_request events.
  # ---------------------------------------------------------------------------
  pr-comment:
    name: "post gate summary"
    runs-on: ubuntu-latest
    needs: scan
    if: always() && github.event_name == 'pull_request'

    permissions:
      pull-requests: write

    steps:
      - name: Download scan result
        uses: actions/download-artifact@v4
        with:
          name: scan-result
          path: /tmp/scan/
        continue-on-error: true

      - name: Build comment body
        id: body
        run: |
          RESULT_FILE="/tmp/scan/tfsec-last.json"
          if [[ ! -f "$RESULT_FILE" ]]; then
            echo "body=⚠️ Scan artifact not found — gate may have failed before writing output." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "$RESULT_FILE" << 'PYEOF'
          import sys, json, os

          with open(sys.argv[1]) as f:
              d = json.load(f)

          gate   = d.get("gate", "UNKNOWN")
          ts     = d.get("timestamp", "—")
          ver    = d.get("tfsec_version", "—")
          counts = d.get("counts", {})
          crit   = counts.get("critical", 0)
          high   = counts.get("high", 0)
          med    = counts.get("medium", 0)
          low    = counts.get("low", 0)

          icon = "✅" if gate == "PASS" else "❌"
          lines = [
              f"## {icon} tfsec Gate: **{gate}**",
              "",
              "| Severity | Count |",
              "|----------|-------|",
              f"| 🔴 CRITICAL | {crit} |",
              f"| 🟠 HIGH     | {high} |",
              f"| 🟡 MEDIUM   | {med}  |",
              f"| 🔵 LOW      | {low}  |",
              "",
              f"tfsec `{ver}` · `{ts}`",
          ]

          findings = d.get("findings", [])
          blocking = [r for r in findings if r.get("severity","").upper() in ("HIGH","CRITICAL")]
          if blocking:
              lines.append("")
              lines.append("### Blocking findings")
              lines.append("| Severity | Rule | Resource | Description |")
              lines.append("|----------|------|----------|-------------|")
              for r in blocking[:10]:
                  lines.append(f"| {r['severity']} | `{r.get('rule_id','')}` | `{r.get('resource','')}` | {r.get('description','')[:80]} |")

          body = "\n".join(lines)
          delim = "EOF_BODY"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"body<<{delim}\n{body}\n{delim}\n")
          PYEOF

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.body.outputs.body }}
          edit-mode: replace
