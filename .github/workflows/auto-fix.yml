# =============================================================================
# .github/workflows/auto-fix.yml
# =============================================================================
# Automated remediation workflow — triggered by the "auto-fix" label on a PR
# or a repository_dispatch event from the agent loop.
#
# SEC_INTENT: auto-fix ONLY operates within the agent allowlist
# (scripts/agent-loop.sh). It can never:
#   - Delete terraform resources
#   - Modify the fixture (modules/security/main.tf)
#   - Push directly to main (always opens a PR)
#   - Run without a human applying the "auto-fix" label first
#
# Allowlisted remediation categories (enforced in triage.py):
#   - Add missing encryption flags on new resources
#   - Enable versioning / logging / access control on S3
#   - Fix MEDIUM/LOW issues flagged in tfsec output
#   HIGH/CRITICAL findings with the fixture signature are blocked.
# =============================================================================

name: Auto-Fix (Agent Loop)

on:
  pull_request:
    types: [labeled]
  repository_dispatch:
    types: [trigger-auto-fix]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    name: "agent-loop remediation"
    runs-on: floci-self-hosted
    # Only trigger when the "auto-fix" label is applied to a PR,
    # or via repository_dispatch. Never run on bare pushes.
    if: |
      (github.event_name == 'pull_request' && github.event.label.name == 'auto-fix') ||
      github.event_name == 'repository_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the PR branch so fixes land on the right branch.
          ref: ${{ github.event.pull_request.head.ref || github.event.client_payload.branch || 'main' }}
          fetch-depth: 0

      - name: Run tfsec (pre-fix baseline)
        run: |
          tfsec terraform/ -f json --no-color --force-all-dirs \
            2>/dev/null | grep -v '^=' | python3 -c "
          import sys, json
          raw = sys.stdin.read()
          idx = raw.find('{')
          d = json.loads(raw[idx:]) if idx >= 0 else {'results': []}
          with open('/tmp/tfsec-pre-fix.json', 'w') as f:
              json.dump(d, f)
          results = d.get('results', [])
          hi = [r for r in results if r['severity'] in ('HIGH','CRITICAL')]
          print(f'Pre-fix: {len(results)} total, {len(hi)} HIGH/CRITICAL')
          "

      # SEC_INTENT: triage.py reads the tfsec output and applies ONLY
      # allowlisted remediations. It refuses to touch the fixture or delete
      # any resource blocks.
      - name: Run AI triage (scripts/ai/triage.py)
        env:
          TRIAGE_INPUT: /tmp/tfsec-pre-fix.json
          TRIAGE_TF_DIR: ${{ github.workspace }}/terraform
          TRIAGE_DRY_RUN: "false"
        run: |
          python3 scripts/ai/triage.py \
            --input  /tmp/tfsec-pre-fix.json \
            --tf-dir terraform/ \
            --output /tmp/triage-report.json

      - name: Validate post-fix terraform
        run: |
          cd terraform && terraform init -no-color -input=false && terraform validate -no-color

      - name: Run tfsec (post-fix verification)
        run: bash scripts/scan.sh

      - name: Commit fixes
        run: |
          git config user.name  "floci-agent-loop"
          git config user.email "agent@floci-stack.local"
          git add terraform/
          # Only commit if there are actual changes.
          if git diff --cached --quiet; then
            echo "No terraform changes to commit — triage was a no-op."
          else
            git commit -m "fix(agent-loop): automated tfsec remediation

          Applied by scripts/ai/triage.py from tfsec output.
          Allowlist: encryption flags, S3 settings, MEDIUM/LOW only.
          Fixture (modules/security/main.tf) not touched.
          "
            git push
          fi

      - name: Post triage report as PR comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 🤖 Auto-Fix Report

            Agent loop ran `scripts/ai/triage.py` against tfsec output.
            See commit for applied changes. Gate re-ran post-fix.

            > Fixture (`modules/security/main.tf`) was **not** modified.
          edit-mode: replace
